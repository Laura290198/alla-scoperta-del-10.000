<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verso il 10.000!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Comic+Neue:wght@700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        h1, h2, h3, .comic-font {
            font-family: 'Comic Neue', cursive;
        }

        .tab-content {
            display: none;
            height: 100%;
            overflow-y: auto;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Colori Standard Italiani Primaria */
        .color-u { background-color: #3b82f6; }   /* Blu */
        .color-da { background-color: #ef4444; }  /* Rosso */
        .color-h { background-color: #22c55e; }   /* Verde */
        .color-k { background-color: #facc15; }   /* Giallo */
        .color-dak { background-color: #f97316; } /* Arancione */

        /* Abaco Styles */
        .abaco-rod {
            width: 12px;
            height: 220px;
            background: linear-gradient(to right, #d1d5db, #9ca3af, #d1d5db);
            border-radius: 6px 6px 0 0;
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 2px;
            gap: 2px;
        }
        .bead {
            width: 32px;
            height: 16px;
            border-radius: 8px;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3), 2px 2px 4px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        /* BAM Styles (Piccoli per stare in pagina) */
        .bam-u {
            width: 12px; height: 12px;
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,0,0,0.2);
            margin: 1px;
        }
        .bam-da {
            width: 12px; height: 120px; /* 10 unità */
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,0,0,0.2);
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 11px, rgba(0,0,0,0.3) 11px, rgba(0,0,0,0.3) 12px);
            margin: 2px;
        }
        .bam-h {
            width: 80px; height: 80px;
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,0,0,0.2);
            background-image: 
                repeating-linear-gradient(to bottom, transparent, transparent 7px, rgba(0,0,0,0.3) 7px, rgba(0,0,0,0.3) 8px),
                repeating-linear-gradient(to right, transparent, transparent 7px, rgba(0,0,0,0.3) 7px, rgba(0,0,0,0.3) 8px);
            margin: 4px;
        }
        .bam-k {
            width: 70px; height: 70px; /* Cubo uK */
            box-shadow: 6px 6px 0 0 #a16207, inset -2px -2px 4px rgba(0,0,0,0.2);
            border: 1px solid rgba(0,0,0,0.3);
            position: relative;
            margin: 6px;
        }
        .bam-k::after {
            content: "1k";
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(0,0,0,0.6); font-weight: bold; font-size: 0.9rem;
        }
        .bam-dak {
            width: 140px; height: 70px; /* Blocco daK */
            box-shadow: 8px 8px 0 0 #9a3412, inset -2px -2px 4px rgba(0,0,0,0.2);
            border: 1px solid rgba(0,0,0,0.3);
            position: relative;
            margin: 8px;
        }
        .bam-dak::after {
            content: "10k";
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(0,0,0,0.8); font-weight: bold; font-size: 1.2rem;
        }

        /* Animations */
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .highlight-exchange { animation: pulseWarning 1s infinite alternate; }
        @keyframes pulseWarning {
            0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.7); }
            100% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }

        /* Layout Griglia BAM */
        .bam-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            width: 100%;
            flex-grow: 1;
        }
        .bam-col {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: center;
            border-right: 1px dashed #cbd5e1;
            padding: 4px;
        }
        .bam-col:last-child { border-right: none; }
        .bam-header {
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 0.875rem;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 8px;
            padding-bottom: 4px;
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow z-10 p-3 flex flex-col md:flex-row justify-between items-center shrink-0 gap-2">
        <h1 class="text-2xl text-emerald-700 font-bold comic-font m-0">Alla scoperta del 10.000!</h1>
        <nav class="flex gap-2">
            <button onclick="switchTab('abaco')" id="btn-abaco" class="px-4 py-2 rounded-lg font-bold bg-emerald-100 text-emerald-800 border-2 border-emerald-500 transition-colors">Abaco</button>
            <button onclick="switchTab('multibase')" id="btn-multibase" class="px-4 py-2 rounded-lg font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 border-2 border-transparent transition-colors">Multibase (BAM)</button>
            <button onclick="switchTab('frantuma')" id="btn-frantuma" class="px-4 py-2 rounded-lg font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 border-2 border-transparent transition-colors">Frantumanumero</button>
        </nav>
    </header>

    <main class="flex-1 overflow-hidden relative w-full h-full">
        
        <!-- TAB 1: ABACO -->
        <section id="tab-abaco" class="tab-content active p-4 bg-green-50 items-center justify-between">
            <div class="w-full max-w-4xl flex justify-between items-center bg-white p-3 rounded-xl shadow shrink-0 mb-4">
                <h2 class="text-xl text-emerald-800 font-bold m-0">L'Abaco</h2>
                <div class="text-3xl font-bold text-gray-800 comic-font" id="abaco-display">9999</div>
                <button onclick="resetAbaco()" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded font-bold shadow transition-colors">🔄 Ricomincia</button>
            </div>

            <div class="relative bg-amber-50 p-8 rounded-xl shadow-lg border-b-8 border-amber-800 flex gap-6 md:gap-10 justify-center items-end flex-grow">
                <!-- Aste Abaco -->
                <div class="flex flex-col items-center">
                    <div id="rod-dak" class="abaco-rod"></div>
                    <div class="mt-2 w-12 h-12 rounded-full color-dak flex items-center justify-center text-white font-bold shadow border-2 border-orange-700">daK</div>
                </div>
                <div class="flex flex-col items-center">
                    <div id="rod-k" class="abaco-rod"></div>
                    <div class="mt-2 w-12 h-12 rounded-full color-k flex items-center justify-center text-yellow-900 font-bold shadow border-2 border-yellow-600">uK</div>
                </div>
                <div class="flex flex-col items-center">
                    <div id="rod-h" class="abaco-rod"></div>
                    <div class="mt-2 w-12 h-12 rounded-full color-h flex items-center justify-center text-white font-bold shadow border-2 border-green-700">h</div>
                </div>
                <div class="flex flex-col items-center">
                    <div id="rod-da" class="abaco-rod"></div>
                    <div class="mt-2 w-12 h-12 rounded-full color-da flex items-center justify-center text-white font-bold shadow border-2 border-red-700">da</div>
                </div>
                <div class="flex flex-col items-center">
                    <div id="rod-u" class="abaco-rod"></div>
                    <div class="mt-2 w-12 h-12 rounded-full color-u flex items-center justify-center text-white font-bold shadow border-2 border-blue-700">u</div>
                </div>
            </div>

            <div class="h-20 flex items-center justify-center w-full shrink-0 mt-4">
                <button id="btn-add-unit-abaco" onclick="addUnitAbaco()" class="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-full font-bold text-lg shadow-[0_4px_0_0_#1d4ed8] active:translate-y-1 transition-all">
                    + 1 Unità
                </button>
                <button id="btn-exchange-abaco" onclick="performExchangeAbaco()" class="hidden px-6 py-2 bg-purple-500 hover:bg-purple-600 text-white rounded-full font-bold text-lg shadow-[0_4px_0_0_#6b21a8] active:translate-y-1 transition-all highlight-exchange">
                    Esegui il cambio!
                </button>
                <div id="msg-success-abaco" class="hidden text-2xl text-emerald-600 font-bold comic-font bg-white px-4 py-2 rounded-lg shadow pop-in">
                    🎉 10.000 Raggiunto! 🎉
                </div>
            </div>
        </section>

        <!-- TAB 2: MULTIBASE (BAM) -->
        <section id="tab-multibase" class="tab-content p-4 bg-blue-50 items-center">
            <div class="w-full max-w-5xl flex justify-between items-center bg-white p-3 rounded-xl shadow shrink-0 mb-4">
                <h2 class="text-xl text-blue-800 font-bold m-0">Multibase (BAM)</h2>
                <div class="text-3xl font-bold text-blue-900 comic-font" id="bam-display">9999</div>
                <button onclick="resetBAM()" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded font-bold shadow transition-colors">🔄 Ricomincia</button>
            </div>
            
            <div class="h-14 flex justify-center items-center w-full shrink-0 mb-4">
                <button id="btn-add-unit-bam" onclick="addUnitBAM()" class="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-full font-bold shadow-[0_4px_0_0_#1d4ed8] active:translate-y-1 transition-all">
                    + Aggiungi 1 Unità
                </button>
                <button id="btn-exchange-bam" onclick="performExchangeBAM()" class="hidden px-6 py-2 bg-purple-500 hover:bg-purple-600 text-white rounded-full font-bold shadow-[0_4px_0_0_#6b21a8] active:translate-y-1 transition-all highlight-exchange">
                    Esegui il cambio!
                </button>
                <div id="msg-success-bam" class="hidden text-xl text-indigo-700 font-bold comic-font bg-indigo-100 px-4 py-2 rounded shadow pop-in">
                    10.000 Completato! 🚀
                </div>
            </div>

            <!-- Griglia BAM -->
            <div class="bg-white rounded-xl shadow-inner border border-gray-200 w-full max-w-6xl bam-grid p-2">
                <div class="bam-col">
                    <div class="bam-header text-orange-600 border-orange-200">daK (10.000)</div>
                    <div id="zone-dak" class="flex flex-wrap justify-center w-full gap-2"></div>
                </div>
                <div class="bam-col">
                    <div class="bam-header text-yellow-600 border-yellow-200">uK (1.000)</div>
                    <div id="zone-k" class="flex flex-wrap justify-center w-full gap-2"></div>
                </div>
                <div class="bam-col">
                    <div class="bam-header text-green-600 border-green-200">h (100)</div>
                    <div id="zone-h" class="flex flex-wrap justify-center w-full gap-2"></div>
                </div>
                <div class="bam-col">
                    <div class="bam-header text-red-600 border-red-200">da (10)</div>
                    <div id="zone-da" class="flex flex-wrap justify-center w-full gap-2"></div>
                </div>
                <div class="bam-col">
                    <div class="bam-header text-blue-600 border-blue-200">u (1)</div>
                    <div id="zone-u" class="flex flex-wrap justify-center w-full gap-1"></div>
                </div>
            </div>
        </section>

        <!-- TAB 3: FRANTUMANUMERO -->
        <section id="tab-frantuma" class="tab-content p-4 bg-purple-50 items-center justify-between">
            <div class="w-full max-w-4xl flex justify-between items-center bg-white p-3 rounded-xl shadow shrink-0 mb-4">
                <h2 class="text-xl text-purple-800 font-bold m-0">Frantumanumero</h2>
                <button onclick="resetFrantuma()" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded font-bold shadow transition-colors">🔄 Ricomincia</button>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-6 border-2 border-purple-100 flex-grow w-full max-w-5xl flex flex-col items-center justify-center relative">
                <p class="text-gray-600 mb-8 text-center text-lg">Esegui le somme a cascata per ricomporre il numero!</p>
                
                <div id="frantuma-container" class="flex flex-row flex-wrap justify-center items-center gap-4 w-full">
                    <!-- Cards inserite via JS -->
                </div>
            </div>

            <div class="h-24 flex items-center justify-center w-full shrink-0 mt-4">
                <button id="btn-action-frantuma" onclick="nextStepFrantuma()" class="px-8 py-3 bg-purple-500 hover:bg-purple-600 text-white rounded-full font-bold text-xl shadow-[0_4px_0_0_#7e22ce] active:translate-y-1 transition-all">
                    + Aggiungi 1
                </button>
                <div id="msg-success-frantuma" class="hidden text-4xl text-purple-700 font-bold comic-font bg-purple-100 px-8 py-4 rounded-xl shadow border border-purple-300 pop-in">
                    10.000! 🎉
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- LOGICA NAVIGAZIONE TAB ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('bg-emerald-100', 'text-emerald-800', 'border-emerald-500');
                el.classList.add('bg-gray-100', 'text-gray-600', 'border-transparent');
            });
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            const activeBtn = document.getElementById(`btn-${tabId}`);
            if(activeBtn){
                activeBtn.classList.remove('bg-gray-100', 'text-gray-600', 'border-transparent');
                activeBtn.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-500');
            }
        }

        // --- STATO INIZIALE CONDIVISO ---
        const initialState = { u: 9, da: 9, h: 9, k: 9, dak: 0 };

        // --- LOGICA ABACO ---
        let abacoState = { ...initialState };
        let abacoPending = false;
        let abacoTarget = null;

        function renderAbaco() {
            const places = ['u', 'da', 'h', 'k', 'dak'];
            let total = abacoState.u + (abacoState.da * 10) + (abacoState.h * 100) + (abacoState.k * 1000) + (abacoState.dak * 10000);
            document.getElementById('abaco-display').innerText = total.toLocaleString('it-IT');

            places.forEach(place => {
                const rod = document.getElementById(`rod-${place}`);
                rod.innerHTML = ''; 
                const count = abacoState[place];
                
                if (count >= 10) rod.classList.add('bg-red-200');
                else rod.classList.remove('bg-red-200');

                for (let i = 0; i < count; i++) {
                    const bead = document.createElement('div');
                    bead.className = `bead color-${place} pop-in`;
                    bead.style.animationDelay = `${i * 0.03}s`;
                    rod.appendChild(bead);
                }
            });
            checkAbacoState();
        }

        function checkAbacoState() {
            const btnAdd = document.getElementById('btn-add-unit-abaco');
            const btnEx = document.getElementById('btn-exchange-abaco');
            const msg = document.getElementById('msg-success-abaco');

            abacoPending = false;
            abacoTarget = null;

            if (abacoState.u >= 10) { abacoTarget = 'u'; btnEx.innerText = "Cambia 10 u in 1 da!"; }
            else if (abacoState.da >= 10) { abacoTarget = 'da'; btnEx.innerText = "Cambia 10 da in 1 h!"; }
            else if (abacoState.h >= 10) { abacoTarget = 'h'; btnEx.innerText = "Cambia 10 h in 1 uK!"; }
            else if (abacoState.k >= 10) { abacoTarget = 'k'; btnEx.innerText = "Cambia 10 uK in 1 daK!"; }

            if (abacoTarget) {
                abacoPending = true;
                btnAdd.classList.add('hidden');
                btnEx.classList.remove('hidden');
            } else {
                if (abacoState.dak === 1) {
                    btnAdd.classList.add('hidden');
                    btnEx.classList.add('hidden');
                    msg.classList.remove('hidden');
                } else {
                    btnAdd.classList.remove('hidden');
                    btnEx.classList.add('hidden');
                    msg.classList.add('hidden');
                }
            }
        }

        function addUnitAbaco() {
            if (abacoPending || abacoState.dak > 0) return;
            abacoState.u++;
            renderAbaco();
        }

        function performExchangeAbaco() {
            if (!abacoPending) return;
            if (abacoTarget === 'u') { abacoState.u -= 10; abacoState.da++; }
            else if (abacoTarget === 'da') { abacoState.da -= 10; abacoState.h++; }
            else if (abacoTarget === 'h') { abacoState.h -= 10; abacoState.k++; }
            else if (abacoTarget === 'k') { abacoState.k -= 10; abacoState.dak++; }
            renderAbaco();
        }

        function resetAbaco() {
            abacoState = { ...initialState };
            renderAbaco();
        }

        // --- LOGICA BAM ---
        let bamState = { ...initialState };
        let bamPending = false;
        let bamTarget = null;

        function renderBAM() {
            const places = ['u', 'da', 'h', 'k', 'dak'];
            let total = bamState.u + (bamState.da * 10) + (bamState.h * 100) + (bamState.k * 1000) + (bamState.dak * 10000);
            document.getElementById('bam-display').innerText = total.toLocaleString('it-IT');

            places.forEach(place => {
                const zone = document.getElementById(`zone-${place}`);
                zone.innerHTML = ''; 
                const count = bamState[place];
                
                if (count >= 10 && place !== 'dak') zone.parentElement.classList.add('bg-red-50');
                else zone.parentElement.classList.remove('bg-red-50');

                for (let i = 0; i < count; i++) {
                    const block = document.createElement('div');
                    block.className = `bam-${place} color-${place} pop-in`;
                    block.style.animationDelay = `${i * 0.02}s`;
                    zone.appendChild(block);
                }
            });
            checkBAMState();
        }

        function checkBAMState() {
            const btnAdd = document.getElementById('btn-add-unit-bam');
            const btnEx = document.getElementById('btn-exchange-bam');
            const msg = document.getElementById('msg-success-bam');

            bamPending = false;
            bamTarget = null;

            if (bamState.u >= 10) { bamTarget = 'u'; btnEx.innerText = "Cambia 10 unità in 1 decina"; }
            else if (bamState.da >= 10) { bamTarget = 'da'; btnEx.innerText = "Cambia 10 decine in 1 centinaio"; }
            else if (bamState.h >= 10) { bamTarget = 'h'; btnEx.innerText = "Cambia 10 centinaia in 1 migliaio"; }
            else if (bamState.k >= 10) { bamTarget = 'k'; btnEx.innerText = "Cambia 10 migliaia in 1 decina di migliaia"; }

            if (bamTarget) {
                bamPending = true;
                btnAdd.classList.add('hidden');
                btnEx.classList.remove('hidden');
            } else {
                if (bamState.dak === 1) {
                    btnAdd.classList.add('hidden');
                    btnEx.classList.add('hidden');
                    msg.classList.remove('hidden');
                } else {
                    btnAdd.classList.remove('hidden');
                    btnEx.classList.add('hidden');
                    msg.classList.add('hidden');
                }
            }
        }

        function addUnitBAM() {
            if (bamPending || bamState.dak > 0) return;
            bamState.u++;
            renderBAM();
        }

        function performExchangeBAM() {
            if (!bamPending) return;
            if (bamTarget === 'u') { bamState.u -= 10; bamState.da++; }
            else if (bamTarget === 'da') { bamState.da -= 10; bamState.h++; }
            else if (bamTarget === 'h') { bamState.h -= 10; bamState.k++; }
            else if (bamTarget === 'k') { bamState.k -= 10; bamState.dak++; }
            renderBAM();
        }

        function resetBAM() {
            bamState = { ...initialState };
            renderBAM();
        }

        // --- LOGICA FRANTUMANUMERO ---
        let franStep = 0;

        function renderFrantuma() {
            const cont = document.getElementById('frantuma-container');
            const btn = document.getElementById('btn-action-frantuma');
            const msg = document.getElementById('msg-success-frantuma');
            
            cont.innerHTML = '';
            let blocks = [];
            
            if (franStep === 0) blocks = [{v:9000, c:'k'}, {v:900, c:'h'}, {v:90, c:'da'}, {v:9, c:'u'}];
            else if (franStep === 1) blocks = [{v:9000, c:'k'}, {v:900, c:'h'}, {v:90, c:'da'}, {v:10, c:'u', pop:true}];
            else if (franStep === 2) blocks = [{v:9000, c:'k'}, {v:900, c:'h'}, {v:100, c:'da', pop:true}];
            else if (franStep === 3) blocks = [{v:9000, c:'k'}, {v:1000, c:'h', pop:true}];
            else if (franStep === 4) blocks = [{v:10000, c:'dak', pop:true}];

            blocks.forEach((b, i) => {
                const c = document.createElement('div');
                let colors = '';
                if(b.c==='u') colors = 'bg-blue-100 text-blue-800 border-blue-400';
                if(b.c==='da') colors = 'bg-red-100 text-red-800 border-red-400';
                if(b.c==='h') colors = 'bg-green-100 text-green-800 border-green-400';
                if(b.c==='k') colors = 'bg-yellow-100 text-yellow-800 border-yellow-400';
                if(b.c==='dak') colors = 'bg-orange-100 text-orange-900 border-orange-500';
                
                c.className = `flex items-center justify-center text-4xl md:text-6xl font-bold comic-font px-6 py-8 rounded-xl shadow-md border-4 ${colors} ${b.pop ? 'pop-in' : ''}`;
                c.innerText = b.v.toLocaleString('it-IT');
                cont.appendChild(c);

                if (i < blocks.length - 1) {
                    const plus = document.createElement('div');
                    plus.className = 'text-5xl text-gray-400 font-bold';
                    plus.innerText = '+';
                    cont.appendChild(plus);
                }
            });

            btn.classList.remove('hidden');
            msg.classList.add('hidden');

            if (franStep === 0) {
                btn.innerText = "+ Aggiungi 1 (9+1)";
                btn.className = "px-8 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-full font-bold text-xl shadow-[0_4px_0_0_#1d4ed8] active:translate-y-1 transition-all";
            } else if (franStep === 1) {
                btn.innerText = "Unisci Decine (90+10)";
                btn.className = "px-8 py-3 bg-red-500 hover:bg-red-600 text-white rounded-full font-bold text-xl shadow-[0_4px_0_0_#b91c1c] active:translate-y-1 transition-all";
            } else if (franStep === 2) {
                btn.innerText = "Unisci Centinaia (900+100)";
                btn.className = "px-8 py-3 bg-green-500 hover:bg-green-600 text-white rounded-full font-bold text-xl shadow-[0_4px_0_0_#15803d] active:translate-y-1 transition-all";
            } else if (franStep === 3) {
                btn.innerText = "Unisci Migliaia (9000+1000)";
                btn.className = "px-8 py-3 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 rounded-full font-bold text-xl shadow-[0_4px_0_0_#a16207] active:translate-y-1 transition-all";
            } else if (franStep === 4) {
                btn.classList.add('hidden');
                msg.classList.remove('hidden');
            }
        }

        function nextStepFrantuma() {
            if (franStep < 4) { franStep++; renderFrantuma(); }
        }
        function resetFrantuma() {
            franStep = 0; renderFrantuma();
        }

        // --- INIZIALIZZAZIONE GLOBALE ---
        window.onload = function() {
            // Inizializza tutte le sezioni
            renderAbaco();
            renderBAM();
            renderFrantuma();
            
            // Apri la prima tab per default
            switchTab('abaco');
        };

    </script>
</body>
</html>
